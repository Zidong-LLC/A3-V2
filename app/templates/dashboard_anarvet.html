<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a0d20">
  <title>A3 CRM - Resultados Anarvet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='os-kit.css') }}?v=9">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=23">
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}?v=10">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="crm-theme" data-sidebar="expanded">
  <div class="os-shell-ambient"><i class="os-glow-orb os-glow-orb--1"></i><i class="os-glow-orb os-glow-orb--2"></i><i class="os-glow-orb os-glow-orb--3"></i></div>
  <div class="crm-app">
    {% set seccion = 'resultados' %}{% include '_sidebar.html' %}

    <main class="crm-main os-scene">
      <header class="top-header">
        <div><p class="hello-label">Bienvenido de nuevo, {{ username }}</p><h1 data-blur-text>Resultados Anarvet</h1></div>
        <a class="ghost-btn" href="{{ url_for('dashboard_results.results_page') }}"><i data-lucide="arrow-left"></i>Volver a Resultados</a>
        <a class="ghost-btn" href="{{ url_for('dashboard_anarvet.clientes_page') }}"><i data-lucide="link"></i>Clientes de Anarvet</a>
      </header>

      <section class="card">
        {% set destino = url_for('dashboard_anarvet.informes_page') %}{% include '_anarvet_informes.html' %}
        </section>
    </main>
  </div>
  <script>window.addEventListener('DOMContentLoaded', function () { if (window.lucide) lucide.createIcons(); });</script>
  <script src="{{ url_for('static', filename='os-fx.js') }}?v=1" defer></script>
</body>
</html>
