<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A3 Portal - Acceso</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-lockup">
      <div class="brand-mark">A3</div>
      <div>
        <h1>Portal A3</h1>
        <p>Resultados y solicitudes de retiro</p>
      </div>
    </div>

    <form method="post" action="{{ url_for('portal.login') }}" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if sedes and sedes|length > 1 %}
        <input type="hidden" name="clinic_name" value="{{ clinic_name }}">
        <input type="hidden" name="nit" value="{{ nit }}">
        <p>Tu NIT tiene varias sedes registradas. Elige con cuál quieres entrar:</p>
        {% for sede in sedes %}
          <label class="sede-option">
            <input type="radio" name="client_id" value="{{ sede.id }}" {% if loop.first %}checked{% endif %}>
            {{ sede.clinic_name }}{% if sede.address %} — {{ sede.address }}{% endif %}
          </label>
        {% endfor %}
        <button type="submit">Entrar con esta sede</button>
        <p><a href="{{ url_for('portal.login') }}">Volver</a></p>
      {% else %}
        <label>Nombre de la veterinaria
          <input name="clinic_name" type="text" autocomplete="organization" value="{{ clinic_name or '' }}" required>
        </label>
        <label>NIT
          <input name="nit" type="text" inputmode="numeric" autocomplete="off" value="{{ nit or '' }}" required>
        </label>
        <button type="submit">Ingresar</button>
      {% endif %}
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    </form>
  </main>
</body>
</html>
