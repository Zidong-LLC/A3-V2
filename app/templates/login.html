<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A3 Plataforma - Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='os-kit.css') }}?v=9">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}?v=9">
</head>
<body class="login-page">
  <div class="os-shell-ambient"><i class="os-glow-orb os-glow-orb--1"></i><i class="os-glow-orb os-glow-orb--2"></i><i class="os-glow-orb os-glow-orb--3"></i></div>
  <main class="login-card os-pop-in">
    <div class="brand-lockup">
      <div class="brand-mark">A3</div>
      <div>
        <h1>Control Center</h1>
        <p>Acceso privado de operaciones</p>
      </div>
    </div>

    <form method="post" action="{{ url_for('dashboard.login') }}" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Usuario
        <input name="username" type="text" autocomplete="username" required>
      </label>
      <label>Contrasena
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Ingresar</button>
      {% if error %}<p class="form-error os-spring-in">{{ error }}</p>{% endif %}
    </form>
  </main>
</body>
</html>
